name: Seal Build

on:
  workflow_dispatch:

jobs:
  build:
    name: build sdist+wheel and run unit tests (Python 3.7)
    runs-on: ubuntu-22.04
    env:
      PYTHONUNBUFFERED: yes
      BOTO_CONFIG: /dev/null
      WORKER_LOGLEVEL: INFO
      PYTHONIOENCODING: UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Install release-era build toolchain
        env:
          PIP_INDEX_URL: https://:2019-03-31@time-machines-pypi.sealsecurity.io/
        run: python -m pip install "setuptools==40.8.0" "wheel==0.33.1"

      - name: Build sdist + wheel
        env:
          PIP_INDEX_URL: https://:2019-03-31@time-machines-pypi.sealsecurity.io/
        run: python setup.py sdist bdist_wheel

      - name: Show built distributions
        run: ls -l dist/

      - name: Pre-install deps absent from the release-date index mirror
        run: python -m pip install --no-deps "atomicwrites==1.3.0" "codecov==2.1.13"

      - name: Install celery test requirements
        env:
          PIP_INDEX_URL: https://:2019-03-31@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install -r requirements/default.txt \
                                -r requirements/test.txt \
                                -r requirements/test-ci-base.txt
          python -m pip install -e . --no-deps

      - name: Run unit test suite
        run: python -m pytest t/unit -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  integration-redis:
    name: integration tests (redis broker+backend, Python 3.7)
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONUNBUFFERED: yes
      BOTO_CONFIG: /dev/null
      WORKER_LOGLEVEL: INFO
      PYTHONIOENCODING: UTF-8
      TEST_BROKER: redis://
      TEST_BACKEND: redis://
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Install release-era build toolchain
        env:
          PIP_INDEX_URL: https://:2019-03-31@time-machines-pypi.sealsecurity.io/
        run: python -m pip install "setuptools==40.8.0" "wheel==0.33.1"

      - name: Pre-install deps absent from the release-date index mirror
        run: python -m pip install --no-deps "atomicwrites==1.3.0" "codecov==2.1.13"

      - name: Install celery integration test requirements
        env:
          PIP_INDEX_URL: https://:2019-03-31@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install -r requirements/default.txt \
                                -r requirements/test.txt \
                                -r requirements/extras/redis.txt \
                                -r requirements/extras/auth.txt \
                                simplejson
          python -m pip install -e . --no-deps

      - name: Run integration test suite
        run: python -m pytest -sv t/integration
